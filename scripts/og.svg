<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Overlay ligero: solo oscurece un poco la foto para que el texto sea legible -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#181818" stop-opacity="0"/>
      <stop offset="100%" stop-color="#181818" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B90FC2"/>
      <stop offset="100%" stop-color="#E83EF0"/>
    </linearGradient>
    <linearGradient id="gradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B90FC2"/>
      <stop offset="100%" stop-color="#E83EF0"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Overlay de gradiente sobre la foto -->
  <rect width="1200" height="630" fill="url(#overlay)"/>

  <!-- Brillo sutil derecha -->
  <circle cx="1100" cy="540" r="200" fill="#E83EF0" opacity="0.06" filter="url(#softglow)"/>


  <!-- Pill badge (derecha) -->
  <rect x="588" y="128" width="230" height="32" rx="16" fill="url(#grad)" opacity="0.15"/>
  <rect x="588" y="128" width="230" height="32" rx="16" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.4"/>
  <circle cx="608" cy="144" r="5" fill="url(#gradV)"/>
  <text x="624" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E83EF0" font-weight="600" letter-spacing="1">SALUD VISUAL · PERÚ</text>

  <!-- Ópticas -->
  <text x="588" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="800" fill="white" letter-spacing="-2">Ópticas</text>
  <!-- GMA en magenta -->
  <text x="588" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="800" fill="url(#grad)" letter-spacing="-2">GMA</text>

  <!-- Tagline -->
  <text x="588" y="382" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="rgba(255,255,255,0.55)" letter-spacing="0.2">Especialistas en salud visual · Jaén, Cajamarca</text>

  <!-- Separador -->
  <rect x="588" y="404" width="500" height="1.5" fill="url(#grad)" opacity="0.28"/>

  <!-- Doctor: avatar -->
  <circle cx="606" cy="438" r="19" fill="url(#gradV)" opacity="0.18"/>
  <circle cx="606" cy="438" r="19" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>
  <text x="606" y="444" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#E83EF0" text-anchor="middle" font-weight="700">AS</text>
  <!-- Doctor: nombre y rol -->
  <text x="636" y="433" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.88)" font-weight="600">Dr. Antonio Santamaría</text>
  <text x="636" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.42)">Director General · Optómetra</text>

  <!-- Stats -->
  <g transform="translate(588, 510)">
    <text x="0"   y="0"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#grad)">+15</text>
    <text x="0"   y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">años</text>
    <rect x="76"  y="-18" width="1" height="42" fill="rgba(255,255,255,0.14)"/>
    <text x="90"  y="0"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#grad)">+5K</text>
    <text x="90"  y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">pacientes</text>
    <rect x="178" y="-18" width="1" height="42" fill="rgba(255,255,255,0.14)"/>
    <text x="192" y="0"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#grad)">4.9★</text>
    <text x="192" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">valoración</text>
  </g>

  <!-- URL -->
  <text x="1148" y="604" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.28)" text-anchor="end" letter-spacing="0.5">www.opticasgma.com</text>

</svg>
