<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B90FC2"/>
      <stop offset="100%" stop-color="#E83EF0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B90FC2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E83EF0" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Fondo oscuro redondeado -->
  <rect width="48" height="48" rx="11" fill="#0f0414"/>

  <!-- Glow difuso detrás del ojo -->
  <ellipse cx="24" cy="24" rx="16" ry="10" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Forma del ojo -->
  <path d="M6 24 C11 14 37 14 42 24 C37 34 11 34 6 24Z"
        fill="none" stroke="url(#g)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Iris con gradiente -->
  <circle cx="24" cy="24" r="7.5" fill="url(#g)"/>

  <!-- Pupila -->
  <circle cx="24" cy="24" r="3.8" fill="#0f0414"/>

  <!-- Reflejo de luz -->
  <circle cx="26.8" cy="21.2" r="1.6" fill="white" opacity="0.88"/>
</svg>
